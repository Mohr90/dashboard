<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- three bars: spending over time -->
  <rect x="12" y="34" width="8" height="16" rx="2.5" fill="#0b1020" fill-opacity="0.85"/>
  <rect x="24" y="26" width="8" height="24" rx="2.5" fill="#0b1020" fill-opacity="0.85"/>
  <rect x="36" y="30" width="8" height="20" rx="2.5" fill="#0b1020" fill-opacity="0.85"/>
  <!-- line: cumulative spend, ending in a dot -->
  <path d="M12 30 L24 22 L36 26 L49 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="14" r="4" fill="#ffffff"/>
